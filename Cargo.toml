[package]
name = "dsync"
version = "0.1.0"
edition = "2021"
description = "Multi-machine dotfiles & project sync across your fleet — git-driven, hub-coordinated, no public SSH needed"
readme = "README.md"
license = "MIT"
repository = "https://github.com/mflkee/dsync"
keywords = ["dotfiles", "sync", "chezmoi", "fleet", "devops"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.80"

[dependencies]
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
russh = "0.44"
russh-keys = "0.44"
directories = "6"
rcgen = "0.13"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
chrono = { version = "0.4", features = ["clock"] }
async-trait = "0.1"
sha2 = "0.10"
subtle = "2"
dialoguer = "0.11"
teloxide = { version = "0.12", default-features = false, features = ["macros", "ctrlc_handler", "rustls"] }

# TUI (dsync tui)
ratatui = "0.30.1"
crossterm = "0.29"
crossbeam-channel = "0.5"

